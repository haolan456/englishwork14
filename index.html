<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e87193"><title>14班作业记录</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">CLASS 14 · HOMEWORK</p><h1>14班作业记录</h1><p class="subhead">记录每日作业完成情况与重默进度</p></div><button class="primary" id="addAssignment">＋ 新增作业</button></header><section class="legend"><span><i class="mark good"></i>完成好</span><span><i class="mark rewrite"></i>需要重默</span><span><i class="mark passed">✓</i>重默通过</span><span><i class="mark none">—</i>未记录</span></section><section class="assignment-bar"><label>当前作业<select id="assignmentSelect"></select></label><button class="text-button" id="editAssignment">编辑作业</button><button class="text-button danger" id="deleteAssignment">删除</button><p id="assignmentMeta"></p></section><section class="overview" id="overview"></section><section class="desktop-panel"><div class="panel-heading"><div><h2>横向完成情况</h2><p>点击格子即可选择状态</p></div><label class="search">⌕ <input id="desktopSearch" placeholder="搜索姓名或学号"></label></div><div class="table-scroll"><table id="matrixTable"><thead></thead><tbody></tbody></table></div></section><section class="mobile-panel"><div class="panel-heading"><div><h2>逐位登记</h2><p>选择状态后会自动保存</p></div><label class="search">⌕ <input id="mobileSearch" placeholder="搜索姓名或学号"></label></div><div class="student-cards" id="studentCards"></div></section><section class="data-tools"><div><h2>数据备份</h2><p>当前记录保存在本浏览器。导出后可在另一台设备导入。</p></div><div class="tool-actions"><button id="exportData">导出记录</button><label class="file-button">导入记录<input type="file" id="importData" accept="application/json"></label></div></section></main><dialog id="assignmentDialog"><form method="dialog" id="assignmentForm"><div class="dialog-title"><h2 id="dialogHeading">新增作业</h2><button value="cancel" class="close">×</button></div><label>日期<input type="date" id="workDate" required></label><label>作业内容<textarea id="workContent" required maxlength="120" placeholder="例如：U1 单词默写 1—20"></textarea></label><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" id="saveAssignment" value="default">保存</button></div></form></dialog><dialog id="statusDialog"><form method="dialog"><div class="dialog-title"><h2 id="statusStudent">选择状态</h2><button value="cancel" class="close">×</button></div><p id="statusWork"></p><div class="status-options"><button value="none" data-status="none"><i class="mark none">—</i><span>未记录</span></button><button value="good" data-status="good"><i class="mark good"></i><span>完成好</span></button><button value="rewrite" data-status="rewrite"><i class="mark rewrite"></i><span>需要重默</span></button><button value="passed" data-status="passed"><i class="mark passed">✓</i><span>重默通过</span></button></div></form></dialog><script src="app.js?v=20261009-filter2"></script></body></html>
